name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: npm

      # npm 10.x is where we've been seeing the "Exit handler never called" ghost.
      # Using npm 9 tends to be more stable in CI for many projects.
      - name: Pin npm (more stable CI)
        run: npm i -g npm@9

      - name: Debug toolchain versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build
        env:
          VITE_BASE: /Genetics/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
