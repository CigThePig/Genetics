name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin npm (more stable CI)
        run: npm i -g npm@9

      - name: Debug toolchain versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify
        run: npm run verify

      - name: Import immutable evolutionary experiment source
        run: git fetch tracks/2026-10-23-emergent-evolution/evidence/continuation/source.bundle refs/heads/evidence/pr144-continuation:refs/evidence/pr144-continuation

      - name: Verify research reports
        run: python -m unittest discover -s tests -p 'test_*.py'
