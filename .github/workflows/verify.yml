name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: npm

      - name: Pin npm (more stable CI)
        run: npm i -g npm@9

      - name: Debug toolchain versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify
        run: npm run verify
