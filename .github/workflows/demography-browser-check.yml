name: Demographic browser verification
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  browser:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/demographic-replacement'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      RECOVERY_BRANCH: ${{ github.head_ref }}
      ECOLOGY_BROWSER_OUT: out/browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Verify bounded startup and recovered source
        run: |
          npm run format
          npm run verify
          python -m unittest discover -s tests -p 'test_demography_report.py'
      - name: Chromium app and narrow viewport checks
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          node scripts/verify-ecology-browser.cjs
          cat out/browser/results.json
      - name: Publish browser result on this PR
        run: |
          cp out/browser/results.json tracks/2026-10-22-demographic-replacement/evidence/browser-results.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add tracks/2026-10-22-demographic-replacement/evidence/browser-results.json
          git commit -m "Verify bounded browser startup and record Chromium checks"
          git push origin "HEAD:$RECOVERY_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demographic-browser-checks
          path: out/browser/
          overwrite: true
