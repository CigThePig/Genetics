<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Genetics behaviour evidence</title
  ><style>
    body {
      background: #101819;
      color: #e1eee7;
      font: 15px system-ui;
      margin: 24px;
    }
    header {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    button,
    select,
    input {
      font: inherit;
      padding: 8px;
      background: #233735;
      color: #e1eee7;
      border: 1px solid #5f8076;
      border-radius: 5px;
    }
    canvas {
      width: min(46vw, 650px);
      background: #1a2827;
      border: 1px solid #3b514c;
    }
    main {
      display: flex;
      gap: 20px;
      margin-top: 16px;
    }
    label {
      display: block;
    }
    #status {
      margin: 12px 0;
    }
    a {
      color: #8bd9b9;
    }
    @media (max-width: 650px) {
      main {
        display: block;
      }
      canvas {
        width: 92vw;
      }
    }
  </style>
  <header>
    <h2>Behaviour playback</h2>
    <select id="scenario"></select
    ><select id="seed">
      <option>1</option>
      <option>42</option>
      <option>1337</option></select
    ><button id="play">Pause</button
    ><select id="speed">
      <option value="1">1×</option>
      <option value="4" selected>4×</option>
      <option value="12">12×</option></select
    ><label><input type="checkbox" id="trails" checked /> Trails</label
    ><input type="range" id="seek" value="0" min="0" max="1000" />
  </header>
  <div id="status"></div>
  <main>
    <section>
      <h3>Baseline b9afecd</h3>
      <canvas id="before" width="640" height="640"></canvas>
    </section>
    <section>
      <h3>Foundation</h3>
      <canvas id="after" width="640" height="640"></canvas>
    </section>
  </main>
  <p>
    Recorded real simulation state at recorded intervals; interpolation is display-only. Arrows show
    headings, lines show goals, rings mark alarm. Trails retain 12 simulated seconds. Controlled
    cohorts and default ecosystems are labelled separately.
  </p>
  <script type="module">
    import { scenarioNames } from './behaviour-scenarios.mjs';
    const $ = (id) => document.getElementById(id);
    let pair = [],
      time = 0,
      playing = true,
      last = performance.now();
    for (const name of ['default', ...scenarioNames]) $('scenario').add(new Option(name, name));
    const root =
      new URL('../', window.location.href).pathname +
      'tracks/2026-10-20-pre-track12-foundation/evidence/';
    let version = 0;
    async function load() {
      const current = ++version;
      const name = $('scenario').value;
      time = 0;
      const loaded = await Promise.all(
        ['baseline', 'final'].map(async (dir) => {
          if (name === 'default' && new URLSearchParams(location.search).has('long'))
            dir += '-long';
          const r = await fetch(`${root}${dir}/${name}-${$('seed').value}-motion.json.gz`);
          if (!r.ok) throw Error(`Missing ${dir} recording`);
          return r.headers.get('content-encoding')?.includes('gzip')
            ? r.json()
            : new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json();
        })
      );
      if (current !== version) return;
      pair = loaded;
      window.playback = {
        name,
        pair,
        drawAt: (t) => {
          time = t;
          draw();
        }
      };
      draw();
    }
    function drawPanel(canvas, data) {
      const ctx = canvas.getContext('2d'),
        sx = 640 / data.width,
        sy = 640 / data.height;
      ctx.clearRect(0, 0, 640, 640);
      const colors = {
        water: '#214d67',
        forest: '#244a38',
        plains: '#718851',
        sand: '#a39268',
        rock: '#59656a',
        shore: '#6d8a76'
      };
      for (let y = 0; y < data.height; y++)
        for (let x = 0; x < data.width; x++) {
          ctx.fillStyle = colors[data.cells[y * data.width + x]] ?? '#334236';
          ctx.fillRect(x * sx, y * sy, sx + 0.3, sy + 0.3);
        }
      const index = Math.min(
          data.frames.length - 1,
          Math.floor(time / (data.sampleSeconds ?? 0.5))
        ),
        f = data.frames[index],
        next = data.frames[Math.min(index + 1, data.frames.length - 1)],
        alpha = time / (data.sampleSeconds ?? 0.5) - index;
      const ids = new Map(next.creatures.map((c) => [c.id, c]));
      if ($('trails').checked)
        for (const c of f.creatures) {
          ctx.strokeStyle =
            c.species === 'triangle' || c.species === 'octagon' ? '#ffbd6a99' : '#c5f0e566';
          ctx.beginPath();
          for (
            let j = Math.max(0, index - Math.ceil(12 / (data.sampleSeconds ?? 0.5)));
            j <= index;
            j++
          ) {
            const p = data.frames[j].creatures.find((n) => n.id === c.id);
            if (p) ctx.lineTo(p.x * sx, p.y * sy);
          }
          ctx.stroke();
        }
      for (const c of f.creatures) {
        const n = ids.get(c.id) ?? c,
          x = (c.x + (n.x - c.x) * alpha) * sx,
          y = (c.y + (n.y - c.y) * alpha) * sy;
        const pred = c.species === 'triangle' || c.species === 'octagon';
        if (c.goal) {
          ctx.strokeStyle = '#ffffff20';
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(c.goal.x * sx, c.goal.y * sy);
          ctx.stroke();
        }
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(c.h);
        ctx.fillStyle = pred ? '#ffbb6b' : c.intent === 'eat' ? '#74e398' : '#e6eee0';
        ctx.beginPath();
        if (pred) {
          ctx.moveTo(5, 0);
          ctx.lineTo(-4, -4);
          ctx.lineTo(-4, 4);
          ctx.closePath();
        } else ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#132724';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(8, 0);
        ctx.stroke();
        if (c.threat) {
          ctx.strokeStyle = '#ff6d73';
          ctx.beginPath();
          ctx.arc(0, 0, 7, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
      ctx.fillStyle = '#fff';
      ctx.font = '13px system-ui';
      ctx.fillText(`${f.creatures.length} animals · ${time.toFixed(1)} s`, 12, 22);
    }
    function draw() {
      if (pair.length < 2) return;
      drawPanel($('before'), pair[0]);
      drawPanel($('after'), pair[1]);
      $('status').textContent =
        `${$('scenario').value === 'default' ? 'Default ecosystem' : 'Controlled ' + $('scenario').value} · Seed ${$('seed').value} · ${time.toFixed(1)} simulated seconds`;
      $('seek').value = (time / (pair[0].frames.length * (pair[0].sampleSeconds ?? 0.5))) * 1000;
    }
    function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      if (playing && pair.length) {
        time += dt * Number($('speed').value);
        if (time > Math.min(...pair.map((d) => (d.frames.length - 1) * (d.sampleSeconds ?? 0.5))))
          time = 0;
        draw();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    $('play').onclick = () => {
      playing = !playing;
      $('play').textContent = playing ? 'Pause' : 'Play';
    };
    $('seek').oninput = () => {
      time =
        (Number($('seek').value) / 1000) *
        ((pair[0]?.frames.length ?? 1) - 1) *
        (pair[0]?.sampleSeconds ?? 0.5);
      draw();
    };
    $('scenario').onchange = $('seed').onchange = () =>
      load().catch((e) => ($('status').textContent = e.message));
    load().catch((e) => ($('status').textContent = e.message));
  </script>
</html>
